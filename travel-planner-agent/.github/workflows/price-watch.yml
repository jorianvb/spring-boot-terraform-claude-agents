name: Veille tarifaire quotidienne

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours a 6h UTC
  workflow_dispatch: {}     # permet aussi un lancement manuel depuis GitHub Actions

permissions:
  contents: write

jobs:
  price-watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r agent-sdk/requirements.txt

      - name: Lancer la veille tarifaire
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent-sdk/watch_prices.py

      - name: Committer le rapport mis a jour
        run: |
          git config user.name "price-watch-bot"
          git config user.email "noreply@example.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Mise a jour automatique de la veille tarifaire"
          git push
