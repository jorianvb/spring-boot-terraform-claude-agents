spring:
  application:
    name: spring-boot-app
  # Base PostgreSQL locale (voir compose.yaml : `docker compose up -d`).
  # En dehors du poste de dev, ces valeurs viennent de variables d'environnement.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate # le schéma est géré par Flyway (src/main/resources/db/migration)
    open-in-view: false

anthropic:
  # Jamais de clé en dur : elle est lue depuis la variable d'environnement ANTHROPIC_API_KEY.
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-5
  max-tokens: 1024
