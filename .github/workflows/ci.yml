# Intégration continue du dépôt : vérifie que le code des 3 projets compile / est valide.
# Aucun appel à l'API Claude ici (pas de secret nécessaire) : on vérifie seulement que les
# exemples des tutoriels sont corrects (Java, Terraform, Python, shell).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spring-boot:
    name: Spring Boot (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-terraform-agents/spring-boot-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-terraform-agents/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - name: terraform validate (envs/dev, sans backend distant)
        working-directory: spring-boot-terraform-agents/terraform/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  python-et-shell:
    name: Scripts Agent SDK (Python) + shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer le SDK
        run: pip install -r travel-planner-agent/agent-sdk/requirements.txt -r photo-storage-agent/agent-sdk/requirements.txt
      - name: Compiler et importer les scripts (sans appeler l'API)
        run: |
          python -m py_compile travel-planner-agent/agent-sdk/*.py photo-storage-agent/agent-sdk/*.py
          for f in travel-planner-agent/agent-sdk/*.py photo-storage-agent/agent-sdk/*.py; do
            python -c "import importlib.util,sys; s=importlib.util.spec_from_file_location('m', sys.argv[1]); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('OK', sys.argv[1])" "$f"
          done
      - name: shellcheck
        run: shellcheck photo-storage-agent/scripts/*.sh
