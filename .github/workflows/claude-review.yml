# Revue automatique des pull requests par Claude Code (projet spring-boot-terraform-agents).
#
# IMPORTANT (monorepo) : GitHub ne lit les workflows QUE dans le dossier .github/workflows/
# à la racine du dépôt. Un workflow rangé dans un sous-dossier de projet n'est jamais exécuté.
# C'est pour ça que ce fichier est ici, avec un filtre `paths` pour ne réagir qu'aux
# changements du projet concerné.
#
# Prérequis : l'app GitHub Claude installée sur le dépôt, et le secret ANTHROPIC_API_KEY
# (ou CLAUDE_CODE_OAUTH_TOKEN, voir la doc) défini dans Settings > Secrets and variables > Actions.
# Le plus simple : lancer `/install-github-app` dans une session Claude Code.
# Doc : https://code.claude.com/docs/en/github-actions

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "spring-boot-terraform-agents/**"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # requis par l'authentification par défaut de l'action (GitHub App)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Plugin officiel de revue de code (même revue que celle installée par /install-github-app).
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment : la revue est postée sur la PR (sinon elle reste dans les logs du workflow).
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Autorise l'outil qui poste les commentaires en ligne sur la PR.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
